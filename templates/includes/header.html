
<header class="top-header">
    <div class="header-title">
        <span class="header-eyebrow">PRIVATE WEALTH MANAGEMENT</span>
        <h2 class="header-page-title">
            {% block page_title %}Dashboard{% endblock %}
        </h2>
    </div>

    <div class="header-user">
        <div class="header-user-avatar" aria-hidden="true">
            {{ user.username|first|upper }}
        </div>

        <div class="header-user-info">
            <span class="header-user-label">SIGNED IN AS</span>
            <span class="header-username">{{ user.username }}</span>
            <span class="header-user-role">
                {{ user.get_role_display|default:"User" }}
            </span>
        </div>

        <span class="header-divider" aria-hidden="true"></span>

        <form method="post" action="{% url 'logout' %}" class="header-logout-form">
            {% csrf_token %}
            <button type="submit" class="header-logout-btn" aria-label="Log out of your account">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="17" height="17" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Sign out</span>
            </button>
        </form>
    </div>
</header>

<style>
    .top-header {
        width: 100%;
        min-height: 86px;
        padding: 16px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        background: #ffffff;
        border-bottom: 1px solid #e9e5dc;
        box-shadow: 0 3px 12px rgba(16, 31, 54, 0.035);
        box-sizing: border-box;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
    }

    .header-title {
        min-width: 0;
    }

    .header-eyebrow {
        display: block;
        margin-bottom: 5px;
        color: #a4824d;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1.8px;
        line-height: 1.4;
    }

    .header-page-title {
        margin: 0;
        color: #14243b;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: -0.55px;
        line-height: 1.3;
        overflow-wrap: anywhere;
    }

    .header-user {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 13px;
        flex-shrink: 0;
    }

    .header-user-avatar {
        width: 43px;
        height: 43px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border-radius: 50%;
        background: #14243b;
        border: 2px solid #e2c38c;
        color: #f2d9a7;
        font-size: 17px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .header-user-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        min-width: 0;
    }

    .header-user-label {
        color: #8a929e;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.1px;
    }

    .header-username {
        max-width: 180px;
        overflow: hidden;
        color: #172941;
        font-size: 13px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .header-user-role {
        display: inline-block;
        max-width: 180px;
        padding: 3px 8px;
        overflow: hidden;
        border: 1px solid #eadfc9;
        border-radius: 4px;
        background: #fbf7ef;
        color: #92703d;
        font-size: 10px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .header-divider {
        width: 1px;
        height: 36px;
        margin: 0 3px;
        background: #e9e5dc;
    }

    .header-logout-form {
        display: inline-flex;
        margin: 0;
    }

    .header-logout-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 13px;
        border: 1px solid #e6d5d2;
        border-radius: 6px;
        background: #fff;
        color: #a13e3e;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        transition: background 0.2s ease, border-color 0.2s ease,
                    color 0.2s ease, transform 0.2s ease;
    }

    .header-logout-btn:hover {
        background: #fff4f3;
        border-color: #d9b4b0;
        color: #842d2d;
    }

    .header-logout-btn:active {
        transform: translateY(1px);
    }

    .header-logout-btn:focus-visible {
        outline: 3px solid rgba(196, 160, 101, 0.45);
        outline-offset: 3px;
    }

    @media (max-width: 760px) {
        .top-header {
            min-height: auto;
            padding: 16px 18px;
            align-items: flex-start;
            flex-direction: column;
            gap: 16px;
        }

        .header-page-title {
            font-size: 21px;
        }

        .header-user {
            width: 100%;
            justify-content: flex-start;
            flex-wrap: wrap;
        }

        .header-user-info {
            flex: 1;
        }

        .header-divider {
            display: none;
        }

        .header-logout-form {
            margin-left: auto;
        }
    }

    @media (max-width: 420px) {
        .top-header {
            padding: 14px;
        }

        .header-user {
            gap: 9px;
        }

        .header-user-avatar {
            width: 37px;
            height: 37px;
        }

        .header-logout-btn {
            min-height: 38px;
            padding: 0 9px;
            gap: 5px;
        }

        .header-logout-btn span {
            font-size: 11px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .header-logout-btn {
            transition: none;
        }
    }
</style>
