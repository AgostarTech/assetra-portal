{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <!-- =====================================================
         GOOGLE TAG (GA4) — ASSETRA AFRICA
         ===================================================== -->
    <script async src="https://www.googletagmanager.com/gtag.js?id=G-VTG8RDGLLN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VTG8RDGLLN');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Assetra Africa Portal | Intelligent Asset Management{% endblock %}</title>
    
    <!-- =====================================================
         ELITE SEO & BRAND META TAGS
         ===================================================== -->
    <meta name="description" content="Discover Assetra Africa, the secure platform delivering streamlined asset records, intelligent wealth control, and professional management solutions.">
    <link rel="canonical" href="https://assetra.africa/">

    <!-- Open Graph / Social Media Preview Tags (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://assetra.africa/">
    <meta property="og:title" content="Assetra Africa Portal | Intelligent Asset Management">
    <meta property="og:description" content="Discover Assetra Africa, the secure platform delivering streamlined asset records, intelligent wealth control, and professional management solutions.">
    <meta property="og:image" content="https://assetra.africa{% static 'images/house.jpg' %}">

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://assetra.africa/">
    <meta name="twitter:title" content="Assetra Africa Portal | Intelligent Asset Management">
    <meta name="twitter:description" content="Discover Assetra Africa, the secure platform delivering streamlined asset records, intelligent wealth control, and professional management solutions.">
    <meta name="twitter:image" content="https://assetra.africa{% static 'images/house.jpg' %}">

    <!-- Organization Schema Markup for Brand Recognition -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Assetra Africa",
      "url": "https://assetra.africa",
      "logo": "https://assetra.africa{% static 'images/house.jpg' %}"
    }
    </script>

    <!-- =====================================================
         GLOBAL BRAND FAVICONS (ASSETRA AFRICA)
         ===================================================== -->
    <link rel="icon" type="image/jpeg" href="{% static settings.SITE_LOGO|default:'images/house.jpg' %}">
    <link rel="shortcut icon" type="image/jpeg" href="{% static settings.SITE_LOGO|default:'images/house.jpg' %}">
    <link rel="apple-touch-icon" href="{% static settings.SITE_LOGO|default:'images/house.jpg' %}">

    <!-- Tailwind CSS (CDN for development/production fallback) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Tailwind Configuration -->
    <script src="{% static 'js/tailwind-config.js' %}"></script>
    <!-- FontAwesome Icons for Branding & UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">
    <!-- Custom Public Styles -->
    <link rel="stylesheet" href="{% static 'css/public.css' %}">
</head>
<body class="bg-brand-black text-slate-200 font-sans antialiased flex flex-col min-h-screen selection:bg-[#086070] selection:text-white">
    
    <!-- Public Header Include -->
    {% include 'public/includes/header.html' %}

    <!-- Main Dynamic Content Area -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Public Footer Include -->
    {% include 'public/includes/footer.html' %}

</body>
</html>
